name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode.app ]]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcrun --show-sdk-path
      - name: Version agreement (AppVersion.swift is the only source)
        run: scripts/version.sh --check
      - name: Debug build
        run: swift build --disable-sandbox
      - name: Release build
        run: swift build --disable-sandbox -c release
      - name: Unit tests (no hardware mutation)
        run: swift test --disable-sandbox
      - name: Core checks (fakes only)
        run: ./.build/release/EmberCoreChecks
      - name: Validate plists, privacy manifest and entitlements
        run: |
          /usr/bin/plutil -lint Resources/Info.plist Resources/PrivacyInfo.xcprivacy Resources/ProjectEmber.entitlements
          /usr/bin/plutil -p Resources/Info.plist
      - name: Shell script syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "${script}"
          done
